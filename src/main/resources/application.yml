server:
  port: 8080

spring:
  application:
    name: pethome-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 业务自定义配置
pethome:
  jwt:
    secret: "pethome-jwt-secret-please-change-in-prod-0123456789abcdef"
    expire-minutes: 10080   # 7 天
  wx:
    app-id: "your-wechat-appid"
    secret: "your-wechat-secret"
    mock-enabled: true      # 本地联调置 true（不请求真实微信）；接真微信时改 false
  oss:
    endpoint: "https://oss-cn-shenzhen.aliyuncs.com"
    access-key-id: "your-access-key-id"
    access-key-secret: "your-access-key-secret"
    bucket: "your-bucket"
    domain: ""              # 可选：自定义域名/CDN，为空则用 endpoint 拼接
    sign-expire-seconds: 600
